<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function () {
        var path = location.pathname;
        if (path === "/" || path === "/index.html" || path === "/landing") {
          document.documentElement.setAttribute("data-route", "home");
        }
      })();
    </script>
    <style>
      html[data-route="home"] body {
        background-color: #111111;
        background-image: url("/ai-disaster-sm.jpg");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
      }
      @media (min-width: 960px) {
        html[data-route="home"] body {
          background-image: url("/ai-disaster.jpg");
        }
      }
    </style>
    <script>
      (function () {
        if (document.documentElement.getAttribute("data-route") !== "home") return;
        function preload(href, media) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = href;
          link.fetchPriority = "high";
          if (media) link.media = media;
          document.head.appendChild(link);
        }
        preload("/logo.jpg");
        preload("/ai-disaster-sm.jpg", "(max-width: 959px)");
        preload("/ai-disaster.jpg", "(min-width: 960px)");
      })();
    </script>
    
    <!-- Primary Meta Tags -->
    <title>Climate Wavers - Disaster Alert & Climate Action Platform</title>
    <meta name="title" content="Climate Wavers - Disaster Alert & Climate Action Platform" />
    <meta name="description" content="Join Climate Wavers, the leading platform for disaster alerts, climate action, and environmental community engagement. Get real-time disaster warnings, connect with climate activists, and make a positive impact on our planet." />
    <meta name="keywords" content="climate change, disaster alerts, environmental action, climate activism, disaster preparedness, environmental community, climate awareness, natural disasters, emergency alerts, climate solutions" />
    <meta name="author" content="Climate Wavers" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://climatewavers.org/" />

      "@context": "https://schema.org",

      "potentialAction": {
