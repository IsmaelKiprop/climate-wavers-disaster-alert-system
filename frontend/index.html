    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function () {
        var path = location.pathname;
        if (path === "/" || path === "/index.html" || path === "/landing") {
          document.documentElement.setAttribute("data-route", "home");
        }
        try {
          var stored = localStorage.getItem("cw_theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : prefersDark
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <style>
      html[data-route="home"] body {
        background-color: #111111;
        background-image: url("/ai-disaster-sm.jpg");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
      }
      @media (min-width: 960px) {
        html[data-route="home"] body {
          background-image: url("/ai-disaster.jpg");
        }
      }
    </style>
    <script>
      (function () {
        if (document.documentElement.getAttribute("data-route") !== "home") return;
        function preload(href, media) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = href;
          link.fetchPriority = "high";
          if (media) link.media = media;
          document.head.appendChild(link);
        }
        preload("/logo.jpg");
        preload("/ai-disaster-sm.jpg", "(max-width: 959px)");
        preload("/ai-disaster.jpg", "(min-width: 960px)");
      })();
    </script>
